<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESS Box 3D Brochure</title>
  
  <link rel="stylesheet" href="style.css?v=3">
  
</head>
<body>

<div class="survey-brochure-container">
  <div class="scene">
    <div class="brochure" id="brochure">
      
      <div class="panel left-panel">
        <div class="face front" style="background-image: url('assets/inside-left.jpg');">
          <div class="shadow-overlay"></div>
        </div>
        <div class="face back" style="background-image: url('assets/cover-front.jpg');"></div>
      </div>

      <div class="panel center-panel">
        <div class="face front" style="background-image: url('assets/inside-center.jpg');">
          <div class="shadow-overlay"></div>
        </div>
        <div class="face back" style="background-image: url('assets/cover-back.jpg');"></div>
      </div>

      <div class="panel right-panel">
        <div class="face front" style="background-image: url('assets/inside-right.jpg');">
          <div class="shadow-overlay"></div>
        </div>
        <div class="face back" style="background-image: url('assets/cover-flap.jpg');"></div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="toggle-state">Open Cover</button>
    <button id="toggle-flip">Flip to Back</button>
  </div>
</div>

<script src="script.js?v=3"></script>

</body>
</html>
